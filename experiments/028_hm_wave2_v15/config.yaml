# Experiment 028 — History matching, wave 2 (+ re-identification pre-flight)
#
# Third attempt. 025 and 027 both died at the same IndexError. Same questions,
# features, sigma and design; the model version is again the only difference.

experiment: 028_hm_wave2_v15
supersedes: 027_hm_wave2_v14   # crashed identically with the v1.4 fix verified active
question: >
  Can the pipeline separate beta_m2f from s_f_young at all; does incidence (a
  rate) constrain what prevalence (a stock) cannot; and does the NROY tighten
  when sigma_disc is halved, or collapse?

environment:
  model_tag: model-v1.5     # v1.4 + non-negative CD4 invariant at both rate lookups
  stisim: 1.5.11
  starsim: 3.5.2
  historymatching: 2.0.1
  python: "3.12.3"
  repo_branch: docs/pre-calibration-release

  model_change_from_v1_4: >
    A non-negative CD4 invariant enforced at BOTH positional rate lookups --
    make_p_hiv_death (off-ART) and get_art_mortality_hazard (on-ART) -- clipping
    to CD4_FLOOR = 1.0, which is upstream's own `cd4_end = 1` convention rather
    than an invented constant. v1.4's acute_decline floor is retained.
    Rationale: 027 proved v1.4's floor was active and still crashed, so a second
    path to negative CD4 exists and is unidentified. The invariant sits where
    every path must pass, so no route can crash the run whether or not it has
    been found. Every clip is recorded with the agents' state flags and
    surfaced per-point in the parquet (n_cd4_guard, cd4_guard_f_* columns), so
    one run both completes and diagnoses.
    Expected value of every guard column is ZERO. Non-zero is a defect to push
    upstream, not a result to accept.

  version_pinning: >
    pyproject.toml constrains starsim>=3.5.2 / stisim>=1.5.11 — GREATER-THAN, so
    a clean `uv sync` resolves 3.6.1 / 1.6.1. Pin with
    `uv pip install starsim==3.5.2 stisim==1.5.11` and run with
    `uv run --no-sync`. See 025 SUMMARY obs 5. Fix properly by pinning == in
    pyproject or restoring [tool.uv.sources].

compute:
  machine: raccoon
  cores: 120
  n_workers: 120
  budget: ~40 min for both parts

# --- Design (identical to 025) -------------------------------------------------

design:
  n_points: 1000
  n_agents: 20_000
  replicates: 1
  stop_year: 2026
  threshold: 4.0
  emulator: bayes_linear    # fall back to gpr if R2 < 0.8
  max_waves: 3
  random_seed: 20260907
  sim_seed: 1
  truth_seed: 7

features:
  applied: simultaneously   # all three, every wave — not a per-wave schedule
  list:
    - {name: prev_15_49_all_mean,    target: 0.2844, sigma: 0.0112}
    - {name: inc_all_mean,           target: 1.8425, sigma: 0.3551}
    - {name: prev_young_old_f_mean,  target: 0.5033, sigma: 0.0755}
  deferred_to_wave_3: [F:M prevalence ratio, F:M incidence ratio]

sigma:
  observations_registered: 46   # tier A 8, B 14, C 24
  prevalence: sqrt(sigma_CI^2 + 0.01^2)
  incidence: sqrt(sigma_CI^2 + (0.10 * target)^2)
  prevalence_ratios: 0.15
  fm_incidence_ratio: 0.35
  peak_aids_deaths: 2000

# --- Mechanical changes from 025, none scientific ------------------------------

corrections:
  cache_key_includes_model: >
    point_key() now hashes the model tag and the starsim/stisim versions
    alongside the parameters, N, stop year and seed. 025 obs 6: the key knew
    nothing about the model, so a --resume after the v1.4 fix would have served
    v1.3 results silently. Folder separation protects across experiments, not
    across a model change inside one.
  cache_state: >
    Cold. 025's 2000 cached points were produced under v1.3 and are invalid here.
    Do NOT copy them in.
  log_labels: >
    025 printed "wave 1 emulates / wave 2 emulates" while passing all three
    features as one list. Now prints the actual list, plus the model tag and
    stack versions.

# --- What the gate must be read for --------------------------------------------

gate_reading_order:
  1: >
    Truth inside the NROY on every parameter, and is the beta_m2f/s_f_young RATIO
    recovered as well as the PRODUCT? Product-only means wave 2's marginals in
    those directions are jointly constrained only. Pre-registered in 025.
  2: >
    age_gap_sd_mult recovery. From exp 026's SUMMARY: the decision quantity is
    what PrEP buys AGYW 15-24 after the cascade closes while the coverage gap is
    in men 25-34, so the link is who AGYW acquire from across the age gap. No
    feature in the set is an age-mixing statistic.
  3: per-feature emulator R2 — drop anything under 0.8 rather than carrying it.
  4: >
    NROY fraction. Under 5%, or the engine's "NROY space collapsed" warning at
    n=1000: suspect sigma_disc = 0.01 before the model. 024's scan predicts 8.4%
    survive on prevalence alone at that sigma.
