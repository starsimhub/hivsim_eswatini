# Experiment 021 — Viral suppression as an input
#
# Two arms, fixed parameters and seeds, isolating one inherited default:
# sti.ART(vls_coverage=None), which stisim treats as 1.0 -- every ART initiator
# virally suppressed. Structurally the same defect 018 removed for PrEP.

experiment: 021_vls_input
question: >
  What does the model do when ART patients are allowed to be virally
  unsuppressed, with the suppression fraction set from PHIA rather than left at
  stisim's default of 1.0?

environment:
  model_tag: model-v1.1
  model_tag_status: >
    NOT YET TAGGED -- 018's PR had not merged when this ran. Ran from
    exp/019-age-dependent-survival, which is exp/018 plus 019. Tag model-v1.1
    on the 018 merge commit; this experiment's tree is that plus 019 and the
    art_vls_coverage injection point.
  stisim: 1.5.11        # commit 97b8bc1
  starsim: 3.5.2        # commit ceddb877
  python: "3.14"

# --- Why this is an input, not a parameter -----------------------------------

framing:
  researcher_call: >
    ART coverage is an input to this model (sti.ART(coverage=art_data) forces it
    to data/art_coverage.csv), so fitting to it would be circular. The same
    logic applies to suppression: PHIA observes it, so it belongs as an input
    rather than a calibration parameter or a fitting target. Decision by the
    researcher, 2026-09-01, correcting the agent's initial suggestion to add
    ART/suppression as calibration targets.
  what_the_default_costs: >
    Suppressed agents transmit at effective_art_efficacy = 0.99, unsuppressed at
    nonsupp_art_efficacy = 0.35 -- 65x the residual transmission. Defaulting to
    1.0 treats every treated agent as effectively non-infectious.
  scale_of_the_error: >
    NOT the 60-point rise in population suppression (62-75% in 2016 to 82-89% in
    2021 among all PLHIV): that is the ART coverage ramp, which the model
    already has as an input. The error is the 4-9% of treated patients who are
    unsuppressed. Suppression among the treated is high and nearly flat --
    0.91-0.92 (2016) to 0.96-0.97 (2021).

# --- Data provenance ---------------------------------------------------------

data:
  builder: vls_construction.py -> data/eswatini_vls.csv
  primary_sources:
    shims3_2021:
      file: data/241123_SHIMS_ENG_RR3_Final-1.pdf   # in this repo
      tables:
        - "Table 8.1 -- VLS by demographic characteristics, incl. treatment
           status. Row 'Aware of HIV status and on ART': m 96.7, f 95.9"
        - "Table 8.2 -- VLS by age and sex, 5-year bands"
    shims2_2016_17:
      url: https://phia.icap.columbia.edu/wp-content/uploads/2019/05/SHIMS2_Final-Report_05.03.2019_forWEB.pdf
      tables:
        - "Table 9.3.A -- row 'Previously diagnosed, on ART': m 91.3, f 92.2"
        - "Table 9.4.A -- VLS by age and sex, 5-year bands and aggregates"
  two_quantities_not_to_conflate:
    vls_among_plhiv: >
      The headline PHIA indicator (Global AIDS Monitoring 1.3/1.4). A cascade
      OUTCOME -- coverage x suppression. Used here for validation (metric 1).
    vls_given_art: >
      Suppression among the treated. The sti.ART(vls_coverage=...) INPUT.
      Feeding it the population figure would double-count the coverage ramp.
  comparability_caveat: >
    SHIMS2 classified ART status by self-report; SHIMS3 by self-report adjusted
    with ARV biomarker testing. The 91.9 -> 96.2 rise is not clean like-for-like.
  excluded_2011: >
    SHIMS1 (2011) has no comparable VLS table. Swaziland_PPDV.csv carries a 2011
    figure of 0.306 (f) / 0.297 (m) among PLHIV, consistent with ART coverage
    ~0.33 x suppression ~0.92 -- i.e. derived, not measured. Deliberately not
    included as an observation.
  sex_coding_hazard: >
    Four files in this project, two conventions, each verified against a primary
    source rather than assumed:
      stisim internal + data/art_coverage.csv        0 = female
      external_data/Swaziland_PPDV.csv               0 = female
      calibration_data/prevalence_by_age_sex.csv     0 = MALE
      external ART prevalence csv                    1 = female
    The inversion is what cost exp 018 its rare-event floor estimate. The
    model's ART input is correctly flipped -- all 9 age x year x sex cells match
    their raw source.

# --- Design ------------------------------------------------------------------

design:
  arms:
    A_vls_1.0:
      vls_coverage: null
      description: stisim default -- every initiator suppressed. The control.
    B_vls_phia:
      vls_coverage: PHIA sex x year series from data/eswatini_vls.csv
      values: {2016: {m: 0.913, f: 0.922}, 2021: {m: 0.967, f: 0.959}}
      description: the correction
  injection_point: >
    make_sim(art_vls_coverage=...) -> make_interventions(art_vls_coverage=...)
    -> sti.ART(vls_coverage=...). Added by this experiment, mirroring the
    existing vmmc_class and hiv_class injection points. Default left at None so
    this A/B measures against current behaviour; flip once adopted.
  no_age_stratification:
    decision: sex and year only
    evidence: >
      vls_construction.derive_given_art_by_age divides age-specific
      VLS-among-PLHIV by age-specific ART coverage. Suppression-given-ART comes
      out flat in age to within 0.3-0.8 percentage points across 15-44 in 2016,
      and the derived mean matches PHIA's directly measured sex figure to
      0.15 pp. The steep age gradient in population suppression is a COVERAGE
      gradient, already represented via art_coverage.csv.
    caveat: >
      The 2021 derivation is circular -- the ART coverage input for 2021 was
      itself back-computed from SHIMS3 VLS. Only 2016 is independent evidence,
      and it is 2016 that carries the conclusion.
    excluded_45_plus: >
      art_coverage.csv has no measured 45+ band: it copies [35,45) into
      [45,100). VLS keeps rising past 45 while the copied coverage does not, so
      the derived ratio exceeds 1.0 there -- impossible. Flagged in the output
      as `implausible`, not silently clipped.
  pre_2016_assumption: >
    vls_coverage held flat at the 2016 value back to 1985 (ART begins ~2004).
    No measurement exists before SHIMS2, and early-ART-era suppression was
    plausibly worse, so holding flat understates the correction. An arm in a
    follow-up if it turns out to matter.
  partial_table_hazard: >
    vls_coverage defaults ANY stratum it is not given to 100%, which would
    silently reintroduce the default being removed. run.py asserts both sexes
    and the full adult range before running.

run:
  n_agents: 10000
  start: 1985
  stop: 2026
  n_seeds: 10          # 018 obs 5: CV 4.4% at this parameter point
  param_set: {beta_m2f: 0.0139, rel_init_prev: 0.49}
  param_set_rationale: >
    High transmission -- continuity with 016-019 and the low-variance point, so
    effect sizes are readable.

metrics:
  1_cascade_vs_phia:
    what: population VLS among PLHIV 15-49 vs SHIMS2/SHIMS3
    why: >
      Not circular in the fitting sense -- coverage and suppression-given-ART
      are both inputs, so suppression among ALL PLHIV is emergent. Needs the new
      Cascade analyzer: stisim carries no result for the on_effective_art /
      on_nonsuppressive_art split.
    result: arm A error +8.5/+8.8 pp (2016); arm B +2.3/+2.1
  2_prevalence: {target: "calibration_data/prevalence_by_age_sex.csv (54 rows)",
                 result: "MAE 0.0590 -> 0.0586; unchanged"}
  3_incidence:
    note: >
      Trajectory only. The 2021 incidence hold-out
      (calibration_data/incidence_2021_VALIDATION_ONLY.csv) is NOT used -- it is
      the validation set and this experiment does not touch it.
  4_deaths: {target: "data/eswatini_hiv_calib.csv, hiv.new_deaths",
             result: "no signal, |z| < 0.6, signs inconsistent"}
  5_cascade_composition: counts on effective vs non-suppressive ART over time

new_shared_code:
  analyzers.Cascade: >
    95-95-95 cascade by sex: diagnosed, on ART, suppressed, for 15-49 and 15+.
    Added to analyzers.py rather than the experiment folder because the decision
    analysis will need it repeatedly -- same precedent as PopByAgeSex, promoted
    by 018 after three local rewrites.

compute:
  host: local laptop (C:\Python314\python.exe)
  n_sims: 20
  runtime: ~90-130 s per sim
