[project]
name = "hivsim-eswatini"
version = "0.1.0"
description = "HIV calibration project for Eswatini, built on Starsim/STIsim"
readme = "README.md"
requires-python = ">=3.11"  # starsim 3.5.2 floor; >=3.10 made uv sync unresolvable
dependencies = [
    # History matching, exp 024. Declared rather than pip-installed because
    # `uv run` re-syncs the environment to pyproject and silently drops
    # anything side-loaded. setuptools<82 is required: setuptools 82 removed
    # pkg_resources, which gpflow still imports, so gpflow breaks without it.
    "historymatching @ git+https://github.com/InstituteforDiseaseModeling/history_matching",
    "setuptools<82",
    "starsim>=3.5.2",
    "stisim>=1.5.11",  # adopted in exp 018; 1.5.11 verified behaviourally neutral
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scipy",
    "sciris",
    "optuna",
    "openpyxl",
    "pyarrow",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
    "ruff",
]

# No [tool.uv.sources]: starsim and stisim resolve from PyPI so the repo is
# clone-and-run. They used to point at editable checkouts two directories up,
# which only worked on machines laid out like the original author's -- flagged
# in CLAUDE.md as "revisit before experiment 009" and still biting at 026.
#
# The local checkout this project was developed against sits on an unmodified
# stisim v1.5.11, so PyPI gives identical behaviour; every fix this project
# once carried locally (the exp-002 ART allocation bug, the exp-005 VMMC
# semantics) has since been absorbed upstream.
#
# To develop against local checkouts instead, add back:
#   [tool.uv.sources]
#   starsim = { path = "/path/to/starsim", editable = true }
#   stisim  = { path = "/path/to/stisim",  editable = true }
