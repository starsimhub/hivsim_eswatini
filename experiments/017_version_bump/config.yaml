# Experiment 017 — Version bump: stisim 1.5.8 -> 1.5.11, starsim 3.5.0 -> 3.5.2
# Four arms at fixed parameters and seeds. Each ADJACENT PAIR differs by one
# thing: A->B is the version, B->C is the background mortality data, B->D is
# rel_death_f. D was added mid-experiment and is not pre-registered.
# Same design lineage as 015 (broken vs fixed VMMC) and 016 (all-cause vs
# HIV-deleted mortality).

experiment: 017_version_bump
question: >
  stisim 1.5.11 makes on-ART HIV mortality nonzero by default — which is the
  first candidate cause 016 named for the model's AIDS-death deficit (~65% of
  the UNAIDS peak). How much does the bump change the model, and how much of
  that deficit does on-ART mortality close?

environment:
  model_tag: model-v1.0         # 5d5698b — pin recorded per CLAUDE.md convention
  python: "3.14"                # local; raccoon runs uv-managed 3.12
  note: >
    stisim and starsim are editable installs from a single checkout each, so the
    version is a property of the ENVIRONMENT, not of the run. Arm A runs on the
    current stack; then the checkouts move to the tags and arms B, C and D run.
    run.py detects the installed version and refuses to run an arm that does not
    match it, so a forgotten checkout move cannot silently corrupt the A/B.

arms:
  A_1_5_8:
    stisim: 1.5.8               # 6755429
    starsim: 3.5.0              # d5380b1b
    datafolder: data/           # as shipped — all-cause mortality, AIDS included
    description: current stack; reproduction check against 016's arm A
  B_1_5_11:
    stisim: 1.5.11              # 97b8bc1 / tag v1.5.11
    starsim: 3.5.2              # tag v3.5.2
    datafolder: data/           # as shipped — all-cause mortality, AIDS included
    description: upgraded stack, same data — isolates the version
  C_1_5_11_hiv_deleted:
    stisim: 1.5.11
    starsim: 3.5.2
    datafolder: outputs/data_hiv_deleted/   # regenerated by 016's construction
    description: >
      upgraded stack + AIDS hump removed from background mortality — isolates
      the data change on the new stack, and is the unbiased measurement of how
      much on-ART mortality closes the deficit. 1.5.11 adds HIV mortality on
      top of background rates that already contain AIDS deaths, and the two
      death machines compete for the same agents (016 observation 5: deleting
      background AIDS RAISED HIV-module deaths 3376 -> 3856 at 2005), so arm B
      alone understates the effect.

  D_1_5_11_no_reldeathf:
    stisim: 1.5.11
    starsim: 3.5.2
    datafolder: data/           # as shipped — all-cause mortality
    hiv_pars: {rel_death_f: 1.0}
    added: 2026-08-26, mid-experiment — NOT pre-registered in the README
    description: >
      isolates rel_death_f, a parameter NEW in 1.5.11 (zero occurrences in
      1.5.8 and 1.5.10) giving women a 26% HIV-mortality reduction that did not
      exist before. Added after a first pass proposed it as the mechanism for an
      apparent prevalence rise; D vs B refuted that (|z| <= 0.9 everywhere).
      Uses the same seeds; resume left A, B and C untouched.

model:
  builder: run_sims.make_sim
  parameters: 016's two sets — deliberately identical, so A reproduces 016's
    arm A and C reproduces 016's arm B
  n_agents: 10000
  start: 1985
  stop: 2026
  n_seeds: 10
  total_sims: 80                # 4 arms x 2 psets x 10 seeds (D added mid-experiment)

param_sets:
  default: {}
  high_transmission:            # 014's best-fitting draw on the two parameters
    beta_m2f: 0.0139            # that actually drive the epidemic
    rel_init_prev: 0.49

construction:
  source: experiments/016_double_counted_mortality/mortality_construction.py
  method: log-linear interpolation between the 1985 and 2025 anchors
  imported_not_copied: >
    016 is closed and its SUMMARY immutable, so importing is read-only and
    avoids duplicating a 350-line module. Promoting these rates to a
    repo-level input under data/ is 018's decision, not this experiment's —
    016 asked for that to be deliberate.

porting:
  vmmc:
    break: circumcision state/efficacy moved from VMMC onto HIV (stisim #576)
    fix: >
      Delete vmmc.py. Upstream sti.VMMC is now itself a prevalence/stock-target
      intervention with per-stratum top-up — the semantics the subclass existed
      to provide. 015 showed those semantics roughly DOUBLE male HIV prevalence,
      so circumcision coverage by age is a required metric, not optional: an
      upstream difference would surface in arm B and read like a mortality
      effect.
  prep:
    break: Prep reimplemented — state on HIV, stock target, prep_eff/dur/adh
    fix: leave the bare sti.Prep() call; it constructs in both versions
    confounder: >
      coverage=None does NOT mean off in either version — both fall back to
      {'year': [2004, 2005, 2015, 2025], 'value': [0, 0.01, 0.5, 0.8]} on FSW
      (10% of women). Every experiment since 001 has run with 50% of FSW on
      PrEP by 2015. 1.5.11 changed the mechanism, so A->B moves for two reasons
      at once. Kept anyway: turning it off would break the arm-A reproduction
      check, and a mismatch there would then be indistinguishable from a
      porting error. Measured instead (metric 8), isolated in 018 if large.
  dashboard:
    break: plot_dashboard.py:111 reads sim.interventions['vmmc'].circumcised
    fix: -> sim.diseases.hiv.circumcised
  not_present:
    - never_art -> art_naive          # no call sites in this repo
    - post_art removed                # no call sites in this repo
  exp_015:
    action: leave as-is — closed experiment, do not port

targets:
  deaths: data/eswatini_hiv_calib.csv        # column hiv.new_deaths (UNAIDS Spectrum)
  circumcision: data/vmmc_coverage.csv       # SHIMS3, as used by 015
  note: >
    NOT data/eswatini_deaths.csv for deaths — that file is background mortality
    rates. Mis-cited in CLAUDE.md and 008's README; corrected by 016.

metrics:
  - arm A vs 016's arm A, and arm C vs 016's arm B — reproduction checks
  - AIDS deaths over time, all arms, vs UNAIDS (the headline)
  - deaths among PLHIV split by module (background ss.Deaths vs HIV)
  - HIV prevalence 15-49 (all, male, female), all arms
  - circumcision coverage by age, all arms, vs SHIMS3 (VMMC equivalence check)
  - total population, all arms, vs UN estimates
  - runtime per sim, all arms (018's model-setup sweep needs the current number)
  - PrEP uptake — n and share of FSW on PrEP over time (confounder check)

compute:
  host: local laptop (C:\Python314\python.exe)
  n_workers: all
  resume: >
    per-sim parquet in outputs/sims/ — a cell whose file exists is never re-run.
    This matters more than usual here: after the checkouts move to 1.5.11, arm A
    is not reproducible without moving them back.
