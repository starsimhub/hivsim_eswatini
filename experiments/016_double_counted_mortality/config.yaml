# Experiment 016 — Is HIV mortality double-counted in the background death rates?
# A/B at fixed parameters, same seeds; only the background mortality data varies.
# Same design as exp 015 (broken vs fixed VMMC), so the effect is isolated rather
# than confounded with a prior change.

experiment: 016_double_counted_mortality
question: >
  data/eswatini_deaths.csv supplies all-cause mortality to ss.Deaths, and its
  adult rates rise 5.5x to a 2005 peak — the shape of the AIDS epidemic. If
  those rates already contain AIDS deaths, the HIV module adds mortality on top
  of mortality already there. How large is the effect, and does correcting it
  move prevalence and deaths toward the targets?

environment:
  model_tag: model-v1.0        # 5d5698b — pin recorded per CLAUDE.md convention
  starsim: 3.5.0               # d5380b1b
  stisim: 1.5.8                # 6755429
  python: "3.14"               # local; raccoon runs uv-managed 3.12

model:
  builder: run_sims.make_sim
  parameters: defaults          # the central configuration used for the A/B in 012/013/015
  n_agents: 10000
  start: 1985
  stop: 2026
  n_seeds: 10

arms:
  all_cause:
    datafolder: data/
    description: as shipped — all-cause mortality, AIDS included
  hiv_deleted:
    datafolder: outputs/data_hiv_deleted/   # generated by mortality_construction.py
    description: AIDS hump removed by log-linear interpolation 1985 <-> 2025

construction:
  method: log-linear interpolation between pre- and post-epidemic anchors
  base_year: 1985               # assumed AIDS-free (very nearly true)
  end_year: 2025                # assumed AIDS-free (not quite — under-deletes slightly)
  years_modified: [1995, 2005, 2015]
  rule: rates are only ever lowered, so bins AIDS never touched are unchanged
  rationale: >
    The interpolated line is the non-AIDS counterfactual and carries the genuine
    secular trend (falling child mortality etc.); only the observed excess above
    it is attributed to AIDS. Log-linear rather than linear because mortality
    trends are multiplicative.
  known_weakness: >
    Implied AIDS share is ~50% at ages 5-10 and 50-60% at ages 55-70, both
    higher than the epidemiology supports — a log-linear counterfactual is too
    rigid there and dumps residual into "AIDS". Trust the 25-45 range most.
    Metric 5 is the check; if it shows over-deletion, restrict to adult ages.

targets:
  deaths: data/eswatini_hiv_calib.csv        # column hiv.new_deaths (UNAIDS Spectrum)
  note: >
    NOT data/eswatini_deaths.csv, which CLAUDE.md and 008's README both
    mis-cited. That file is background mortality rates; this one is UNAIDS
    AIDS-death counts. Corrected 2026-08-19.

metrics:
  - HIV prevalence 15-49 (all, male, female) over time, both arms
  - hiv.new_deaths over time, both arms, vs the UNAIDS target
  - deaths among PLHIV attributed to the background module vs the HIV module
  - total population over time, both arms (refutation check — if the
    double-counted model already tracks population, removing the hump overshoots)
  - implied AIDS deaths from the deleted rates vs the UNAIDS target
    (validation of the construction; uses the model's own population as
    denominator, which is mildly circular but adequate for magnitude)

compute:
  host: raccoon (Azure HB120rs_v2, 120 cores, spot)
  n_workers: all
  resume: per-sim parquet in outputs/sims/ — reruns skip completed cells
